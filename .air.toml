# Live reload for the Go server during `task dev:server`.
root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/athenaeum-dev"
  cmd = "go build -o ./tmp/athenaeum-dev ./cmd/athenaeum"
  delay = 800
  exclude_dir = ["assets", "bin", "coverage", "data", "docs", "library", "man", "node_modules", "showcase", "site", "tmp", "vendor", "web", ".git", ".gremlins", ".github"]
  exclude_file = []
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = true
  follow_symlink = false
  full_bin = "./tmp/athenaeum-dev --addr :8080 --library ./library --data ./data"
  include_dir = ["cmd", "internal"]
  include_ext = ["go"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
