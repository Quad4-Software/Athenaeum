name: Bug report
description: Report a bug in Athenaeum
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for filing a bug. Please search existing issues first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, config flags, and whether Docker or bare metal.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `athenaeum version` or image tag.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - macOS
        - Windows
        - Docker / other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server logs (redact secrets).
      render: text
