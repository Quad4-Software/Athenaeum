version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 5
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 5
    commit-message:
      prefix: chore(deps)
    groups:
      go-modules:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - go

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm-web:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: "@sentry/svelte"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - frontend

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm-docs:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - docs

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 5
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /docker/kokoro
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 5
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - docker
