# Build multi-arch binaries, publish a GitHub Release, and push to GHCR.
# Triggered by version tags (v*) or manual dispatch. Actions are SHA-pinned.
#
# Immutable releases (repo setting): assets and the Git tag lock on publish.
# Always create a draft, attach every asset, then publish. Never move or reuse
# a published tag. See https://docs.github.com/en/code-security/concepts/supply-chain-security/immutable-releases
#
# Platform matrix and binary naming live in scripts/platforms.sh (single source).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing tag to finish (must be unpublished or still a draft).
          Published immutable releases cannot gain assets or move tags.
          Leave empty on a tag push.
        required: false
        type: string
      push_image:
        description: Push container image to GHCR
        type: boolean
        default: true

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  REGISTRY: ghcr.io
  NODE_VERSION: "26"
  PNPM_VERSION: "12.16.1"
  DOCKER_PLATFORMS: linux/amd64,linux/arm64
  ARTIFACT_RETENTION_DAYS: "14"

jobs:
  targets:
    name: Release targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Matrix from platforms.sh
        id: gen
        run: |
          {
            echo "include<<EOF"
            bash scripts/platforms.sh gha-include
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.name }})
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.include) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install frontend deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: bash scripts/ci-release-meta.sh

      - name: Build slim frontend
        working-directory: web
        run: pnpm build:slim

      - name: Cross-compile slim
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ steps.meta.outputs.version }}
          SLIM: "1"
          OUT_DIR: dist
        run: bash scripts/build-one.sh

      - name: Build full frontend
        working-directory: web
        run: |
          bash ../scripts/fetch-kokoro-models.sh
          pnpm build:fast

      - name: Cross-compile full
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ steps.meta.outputs.version }}
          OUT_DIR: dist
        run: bash scripts/build-one.sh

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: athenaeum-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}

  container:
    name: Container image
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.push_image == true ||
      inputs.push_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # checkout
      packages: write # push image to GHCR
      id-token: write # keyless cosign signing and attestation OIDC
      attestations: write # GitHub build provenance and SBOM attestations
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve image name
        id: image
        env:
          REPO: ${{ github.repository }}
        run: |
          owner_repo="$(echo "${REPO}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner_repo}" >> "${GITHUB_OUTPUT}"

      - name: Resolve version
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: bash scripts/ci-release-meta.sh

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        env:
          # Attach OCI annotations at both manifest and index level.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          # Keep metadata labels identical to the static Dockerfile LABEL set
          # so CI output and local builds cannot drift.
          labels: |
            org.opencontainers.image.title=Athenaeum
            org.opencontainers.image.description=Self-hosted library for EPUB, PDF, comics, and audiobooks
            org.opencontainers.image.url=https://github.com/Quad4-Software/Athenaeum
            org.opencontainers.image.source=https://github.com/Quad4-Software/Athenaeum
            org.opencontainers.image.documentation=https://athenaeum.quad4.io
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Quad4 Software
            org.opencontainers.image.authors=Quad4
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.image_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.image_tag }}
            type=raw,value=latest,enable=${{ startsWith(steps.ver.outputs.image_tag, 'v') && !contains(steps.ver.outputs.image_tag, '-') }}
            type=sha,prefix=sha-,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build metadata
        id: buildmeta
        run: |
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        id: imagebuild
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.buildmeta.outputs.created }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ env.DOCKER_PLATFORMS }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign image digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.imagebuild.outputs.digest }}
        run: cosign sign --yes "${IMAGE}"

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.imagebuild.outputs.digest }}
          push-to-registry: true

      - name: Generate image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.imagebuild.outputs.digest }}
          format: spdx-json
          artifact-name: athenaeum-image-sbom.spdx.json
          output-file: athenaeum-image-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attest image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.imagebuild.outputs.digest }}
          sbom-path: athenaeum-image-sbom.spdx.json
          push-to-registry: true

      # Fail the release here if signing or attestation did not stick.
      - name: Verify image signature and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.imagebuild.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}" \
            --certificate-identity-regexp "^https://github.com/${REPO}/.github/workflows/release\.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          gh attestation verify "oci://${IMAGE}" --repo "${REPO}"

  release:
    name: GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
      attestations: write # GitHub build provenance and SBOM attestations
      id-token: write # keyless cosign signing and attestation OIDC
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: bash scripts/ci-release-meta.sh

      - name: Guard published immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            echo "No existing release for ${TAG}; will create a draft."
            exit 0
          fi
          draft="$(gh release view "${TAG}" --json isDraft -q .isDraft)"
          if [[ "${draft}" != "true" ]]; then
            echo "::error::Release ${TAG} is already published."
            echo "Immutable releases cannot add/replace assets or move tags."
            echo "Push a new version tag instead of rebuilding ${TAG}."
            exit 1
          fi
          echo "Reusing draft release ${TAG}."

      - name: Aggregate checksums
        run: |
          cd dist
          shopt -s extglob
          sha256sum !(*.sha256|SHA256SUMS.txt|*.sigstore.json) > .sha256sums.tmp
          mv .sha256sums.tmp SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          artifact-name: athenaeum-sbom.spdx.json
          output-file: dist/athenaeum-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: License report
        run: |
          mkdir -p dist
          {
            echo "# Third-party licenses"
            echo
            echo "Go modules: see go.mod / vendor/."
            echo "Frontend packages: see web/package.json and the SPDX SBOM attached to this release."
            echo
            echo "Generated at release time alongside athenaeum-sbom.spdx.json."
          } > dist/NOTICE.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign release artifacts
        run: |
          set -euo pipefail
          cd dist
          shopt -s extglob
          for f in !(*.sha256|*.sigstore.json); do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "${f}"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-checksums: dist/SHA256SUMS.txt
          sbom-path: dist/athenaeum-sbom.spdx.json

      # Draft -> attach all assets -> publish (immutable-release safe).
      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Reusing draft release ${TAG}."
          else
            args=(--draft --title "Athenaeum ${TAG}" --generate-notes)
            if [[ "${PRERELEASE}" == "true" ]]; then
              args+=(--prerelease)
            else
              args+=(--latest)
            fi
            gh release create "${TAG}" "${args[@]}"
          fi
          gh release upload "${TAG}" dist/* --clobber

      - name: Verify artifact signatures and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          cosign verify-blob \
            --certificate-identity-regexp "^https://github.com/${REPO}/.github/workflows/release\.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --bundle SHA256SUMS.txt.sigstore.json \
            SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          while IFS= read -r f; do
            gh attestation verify "${f}" --repo "${REPO}"
          done < <(cut -d' ' -f3 SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release edit "${TAG}" --draft=false
