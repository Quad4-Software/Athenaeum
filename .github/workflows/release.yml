# Build multi-arch binaries, publish a GitHub Release, and push to GHCR.
# Triggered by version tags (v*) or manual dispatch. Actions are SHA-pinned.
#
# Immutable releases (repo setting): assets and the Git tag lock on publish.
# Always create a draft, attach every asset, then publish. Never move or reuse
# a published tag. See https://docs.github.com/en/code-security/concepts/supply-chain-security/immutable-releases
#
# Platform matrix and binary naming live in scripts/platforms.sh (single source).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing tag to finish (must be unpublished or still a draft).
          Published immutable releases cannot gain assets or move tags.
          Leave empty on a tag push.
        required: false
        type: string
      push_image:
        description: Push container image to GHCR
        type: boolean
        default: true

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  REGISTRY: ghcr.io
  NODE_VERSION: "22"
  PNPM_VERSION: "11.17.0"
  DOCKER_PLATFORMS: linux/amd64,linux/arm64
  ARTIFACT_RETENTION_DAYS: "14"

jobs:
  targets:
    name: Release targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Matrix from platforms.sh
        id: gen
        run: |
          {
            echo "include<<EOF"
            bash scripts/platforms.sh gha-include
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.name }})
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.include) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: bash scripts/ci-release-meta.sh

      - name: Build slim frontend
        working-directory: web
        run: pnpm build:slim

      - name: Cross-compile slim
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ steps.meta.outputs.version }}
          SLIM: "1"
          OUT_DIR: dist
        run: bash scripts/build-one.sh

      - name: Build full frontend
        working-directory: web
        run: |
          bash ../scripts/fetch-kokoro-models.sh
          pnpm build:fast

      - name: Cross-compile full
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ steps.meta.outputs.version }}
          OUT_DIR: dist
        run: bash scripts/build-one.sh

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: athenaeum-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}

  container:
    name: Container image
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.push_image == true ||
      inputs.push_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve image name
        id: image
        env:
          REPO: ${{ github.repository }}
        run: |
          owner_repo="$(echo "${REPO}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner_repo}" >> "${GITHUB_OUTPUT}"

      - name: Resolve version
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: bash scripts/ci-release-meta.sh

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.image_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.image_tag }}
            type=raw,value=latest,enable=${{ startsWith(steps.ver.outputs.image_tag, 'v') && !contains(steps.ver.outputs.image_tag, '-') }}
            type=sha,prefix=sha-,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build metadata
        id: buildmeta
        run: |
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.buildmeta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ env.DOCKER_PLATFORMS }}

  release:
    name: GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Release attestations for immutable publishes (GitHub-generated).
      attestations: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: bash scripts/ci-release-meta.sh

      - name: Guard published immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            echo "No existing release for ${TAG}; will create a draft."
            exit 0
          fi
          draft="$(gh release view "${TAG}" --json isDraft -q .isDraft)"
          if [[ "${draft}" != "true" ]]; then
            echo "::error::Release ${TAG} is already published."
            echo "Immutable releases cannot add/replace assets or move tags."
            echo "Push a new version tag instead of rebuilding ${TAG}."
            exit 1
          fi
          echo "Reusing draft release ${TAG}."

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          artifact-name: athenaeum-sbom.spdx.json
          output-file: dist/athenaeum-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: License report
        run: |
          mkdir -p dist
          {
            echo "# Third-party licenses"
            echo
            echo "Go modules: see go.mod / vendor/."
            echo "Frontend packages: see web/package.json and the SPDX SBOM attached to this release."
            echo
            echo "Generated at release time alongside athenaeum-sbom.spdx.json."
          } > dist/NOTICE.txt

      # Draft -> attach all assets -> publish (immutable-release safe).
      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Athenaeum ${{ steps.tag.outputs.tag }}
          draft: true
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.tag.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          files: dist/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release edit "${TAG}" --draft=false
