# Documentation site (Docusaurus) -> GitHub Pages, with offline demo at /demo.
# Actions are SHA-pinned.
name: Deploy docs Pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "web/**"
      - "showcase/**"
      - ".github/workflows/pages.yml"

concurrency:
  group: pages-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.17.0"

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            docs/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Build Docusaurus site
        working-directory: docs
        env:
          CI: true
          GITHUB_REPOSITORY: ${{ github.repository }}
          DOCUSAURUS_BASE_URL: /
          DOCUSAURUS_URL: https://athenaeum.quad4.io
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build offline demo SPA
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build:demo

      - name: Embed demo under /demo
        run: |
          rm -rf docs/build/demo
          mkdir -p docs/build/demo
          cp -a site/. docs/build/demo/
          if [ -f docs/build/demo/index.html ]; then
            echo "demo index present"
          fi
          if [ -f docs/build/CNAME ]; then
            echo "CNAME=$(cat docs/build/CNAME)"
          else
            echo "::error::docs/build/CNAME missing (expected athenaeum.quad4.io)"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
