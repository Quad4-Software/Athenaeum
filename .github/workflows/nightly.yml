# Nightly prerelease builds from master/main.
# Publishes a moving `nightly` GitHub Release and GHCR :nightly image.
# Actions are SHA-pinned (same pins as release.yml).
name: Nightly

on:
  schedule:
    # 06:15 UTC daily (staggered from CodeQL's Monday 04:27).
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even when HEAD already matches the nightly tag
        type: boolean
        default: false
      push_image:
        description: Push container image to GHCR
        type: boolean
        default: true

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.meta.outputs.should_run }}
      version: ${{ steps.meta.outputs.version }}
      date: ${{ steps.meta.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve nightly version
        id: meta
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          date_utc="$(date -u +%Y%m%d)"
          version="0.0.0-nightly.${date_utc}"
          echo "date=${date_utc}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          should_run=true
          if [[ "${FORCE}" != "true" ]] && git rev-parse -q --verify refs/tags/nightly >/dev/null; then
            nightly_sha="$(git rev-list -n 1 refs/tags/nightly)"
            if [[ "${nightly_sha}" == "${HEAD_SHA}" ]]; then
              should_run=false
              echo "HEAD already published as nightly (${HEAD_SHA}); skipping."
            fi
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${FORCE}" == "true" ]]; then
            should_run=true
          fi
          echo "should_run=${should_run}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            goarm: ""
            suffix: amd64
          - name: linux-arm64
            goos: linux
            goarch: arm64
            goarm: ""
            suffix: arm64
          - name: linux-armv6
            goos: linux
            goarch: arm
            goarm: "6"
            suffix: armv6
          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            suffix: armv7
          - name: linux-riscv64
            goos: linux
            goarch: riscv64
            goarm: ""
            suffix: riscv64
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            goarm: ""
            suffix: amd64
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            goarm: ""
            suffix: arm64
          - name: windows-amd64
            goos: windows
            goarch: amd64
            goarm: ""
            suffix: amd64
          - name: windows-arm64
            goos: windows
            goarch: arm64
            goarm: ""
            suffix: arm64
          - name: freebsd-amd64
            goos: freebsd
            goarch: amd64
            goarm: ""
            suffix: amd64
          - name: freebsd-arm64
            goos: freebsd
            goarch: arm64
            goarm: ""
            suffix: arm64
          - name: openbsd-amd64
            goos: openbsd
            goarch: amd64
            goarm: ""
            suffix: amd64
          - name: openbsd-arm64
            goos: openbsd
            goarch: arm64
            goarm: ""
            suffix: arm64
          - name: netbsd-amd64
            goos: netbsd
            goarch: amd64
            goarm: ""
            suffix: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build:fast

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.prepare.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          out="athenaeum-${VERSION}-${GOOS}-${SUFFIX}"
          if [[ "${GOOS}" == "windows" ]]; then out="${out}.exe"; fi
          go build -mod=vendor -trimpath \
            -ldflags "-s -w -X athenaeum/internal/version.Version=${VERSION} -X athenaeum/internal/version.WebVersion=${VERSION}" \
            -o "${out}" ./cmd/athenaeum
          mkdir -p dist
          mv "${out}" dist/
          (cd dist && sha256sum "$(basename "${out}")" > "$(basename "${out}").sha256")

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: athenaeum-nightly-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  container:
    name: Container image
    needs: prepare
    if: >-
      needs.prepare.outputs.should_run == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.push_image == true ||
       inputs.push_image == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image name
        id: image
        env:
          REPO: ${{ github.repository }}
        run: |
          owner_repo="$(echo "${REPO}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner_repo}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-${{ needs.prepare.outputs.date }}
            type=sha,prefix=sha-,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build metadata
        id: buildmeta
        run: |
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.buildmeta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  release:
    name: GitHub Nightly Release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
          pattern: athenaeum-nightly-*

      - name: Remove previous nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes
          fi

      - name: Point nightly tag at this commit
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git tag -f nightly "${HEAD_SHA}"
          git push -f origin refs/tags/nightly

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          artifact-name: athenaeum-nightly-sbom.spdx.json
          output-file: dist/athenaeum-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: License report
        run: |
          mkdir -p dist
          {
            echo "# Third-party licenses"
            echo
            echo "Go modules: see go.mod / vendor/."
            echo "Frontend packages: see web/package.json and the SPDX SBOM attached to this release."
            echo
            echo "Nightly build ${{ needs.prepare.outputs.version }} at ${{ github.sha }}."
          } > dist/NOTICE.txt

      # Immutable releases lock assets once published. Prereleases publish
      # immediately, so create as draft, upload assets, then publish.
      - name: Create nightly release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: nightly
          name: Nightly ${{ needs.prepare.outputs.date }}
          draft: true
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            Automated nightly build from `${{ github.sha }}`.

            Version string: `${{ needs.prepare.outputs.version }}`

            Container image tags: `nightly`, `nightly-${{ needs.prepare.outputs.date }}`, and `sha-<short>`.

            This GitHub Release is replaced on each successful nightly run.
          files: dist/*

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit nightly --draft=false
