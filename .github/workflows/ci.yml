# CI for Athenaeum: lint, test, cross-build, Docker, Lighthouse, gosec.
# Actions are pinned to full commit SHAs (see GitHub secure-use reference).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      lighthouse:
        description: Run Lighthouse CI
        type: boolean
        default: true
      docker:
        description: Build Docker image
        type: boolean
        default: true
      e2e:
        description: Run Playwright e2e tests
        type: boolean
        default: true
      mutation:
        description: Run Go mutation testing (Gremlins)
        type: boolean
        default: false
      fuzz:
        description: Run Go fuzz targets
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go
            kind: go
          - name: web
            kind: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        if: matrix.kind == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup pnpm
        if: matrix.kind == 'web'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node
        if: matrix.kind == 'web'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Go fmt
        if: matrix.kind == 'go'
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        if: matrix.kind == 'go'
        run: go vet ./...

      - name: golangci-lint
        if: matrix.kind == 'go'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m ./...

      - name: Generated API client check
        if: matrix.kind == 'go'
        run: go run ./cmd/genapi -root . -check

      - name: Install frontend dependencies
        if: matrix.kind == 'web'
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: ESLint, Prettier, svelte-check
        if: matrix.kind == 'web'
        working-directory: web
        run: |
          pnpm lint
          pnpm format:check
          pnpm check

      - name: Unused web deps
        if: matrix.kind == 'web'
        working-directory: web
        run: pnpm knip
        continue-on-error: true

  go-test:
    name: Go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test -mod=vendor -count=1 ./...

      - name: Race (linux)
        if: runner.os == 'Linux'
        run: go test -mod=vendor -race -count=1 ./...

      - name: Contract / drift
        if: runner.os == 'Linux'
        run: go test -mod=vendor -count=1 -run 'Contract|Drift|EnvExample' ./internal/server/ ./internal/config/

  go-fuzz:
    name: Go fuzz
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.fuzz == true ||
      inputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Short fuzz
        env:
          FUZZTIME: 15s
          SCOPE: ./internal/...
        run: bash scripts/fuzz-all.sh

  go-coverage:
    name: Go coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Coverage
        env:
          COVERAGE_MIN: "45"
        run: bash scripts/coverage-go.sh

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  go-mutation:
    name: Go mutation
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.mutation == true || inputs.mutation == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Mutation (Gremlins)
        env:
          MUTATION_EFFICACY: "70"
          MUTATION_MCOVER: "40"
        run: bash scripts/mutation-go.sh

  go-build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            goarm: ""
            suffix: amd64
          - name: linux-arm64
            goos: linux
            goarch: arm64
            goarm: ""
            suffix: arm64
          - name: linux-armv6
            goos: linux
            goarch: arm
            goarm: "6"
            suffix: armv6
          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            suffix: armv7
          - name: linux-riscv64
            goos: linux
            goarch: riscv64
            goarm: ""
            suffix: riscv64
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            goarm: ""
            suffix: amd64
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            goarm: ""
            suffix: arm64
          - name: windows-amd64
            goos: windows
            goarch: amd64
            goarm: ""
            suffix: amd64
          - name: windows-arm64
            goos: windows
            goarch: arm64
            goarm: ""
            suffix: arm64
          - name: freebsd-amd64
            goos: freebsd
            goarch: amd64
            goarm: ""
            suffix: amd64
          - name: freebsd-arm64
            goos: freebsd
            goarch: arm64
            goarm: ""
            suffix: arm64
          - name: openbsd-amd64
            goos: openbsd
            goarch: amd64
            goarm: ""
            suffix: amd64
          - name: openbsd-arm64
            goos: openbsd
            goarch: arm64
            goarm: ""
            suffix: arm64
          - name: netbsd-amd64
            goos: netbsd
            goarch: amd64
            goarm: ""
            suffix: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
          SUFFIX: ${{ matrix.suffix }}
        run: |
          out="bin/athenaeum-${GOOS}-${SUFFIX}"
          if [[ "${GOOS}" == "windows" ]]; then out="${out}.exe"; fi
          mkdir -p bin
          go build -mod=vendor -trimpath -ldflags "-s -w" -o "${out}" ./cmd/athenaeum
          ls -la "${out}"

  self-check:
    name: Self-check (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            goarm: ""
            qemu: ""
          - name: linux-arm64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64
            goarm: ""
            qemu: qemu-aarch64
          - name: linux-armv7
            runner: ubuntu-latest
            goos: linux
            goarch: arm
            goarm: "7"
            qemu: qemu-arm
          - name: linux-armv6
            runner: ubuntu-latest
            goos: linux
            goarch: arm
            goarm: "6"
            qemu: qemu-arm
          - name: linux-riscv64
            runner: ubuntu-latest
            goos: linux
            goarch: riscv64
            goarm: ""
            qemu: qemu-riscv64
          - name: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            goarm: ""
            qemu: ""
          - name: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            goarm: ""
            qemu: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install QEMU user mode
        if: matrix.qemu != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin
          out="bin/athenaeum"
          if [[ "${GOOS}" == "windows" ]]; then out="${out}.exe"; fi
          go build -mod=vendor -trimpath -ldflags "-s -w" -o "${out}" ./cmd/athenaeum
          echo "BIN=${out}" >> "${GITHUB_ENV}"

      - name: Run --self-check
        shell: bash
        env:
          QEMU: ${{ matrix.qemu }}
        run: |
          if [[ -n "${QEMU}" ]]; then
            "${QEMU}-static" "./${BIN}" --self-check
          else
            "./${BIN}" --self-check
          fi

  web-test:
    name: Web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install and test
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test:run
          pnpm test:coverage

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: govulncheck
        run: bash scripts/govulncheck.sh
        continue-on-error: true

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Audit
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod
        continue-on-error: true

  deadcode:
    name: deadcode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: deadcode
        run: bash scripts/deadcode.sh
        continue-on-error: true

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run gosec
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        with:
          args: >-
            -exclude-dir=web/node_modules
            -exclude-dir=vendor
            ./...

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  docker:
    name: Docker build
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.docker == true ||
      inputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image (host arch, load for self-check)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: athenaeum:ci
          build-args: |
            VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container --self-check
        run: |
          docker run --rm athenaeum:ci --self-check

      - name: Build multi-arch (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          build-args: |
            VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/riscv64

  lighthouse:
    name: Lighthouse CI
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.lighthouse == true ||
      inputs.lighthouse == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium || \
            sudo apt-get install -y --no-install-recommends chromium-browser

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run Lighthouse CI
        env:
          LIGHTHOUSE_MIN_SCORE: "0.9"
        run: task test:lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-ci
          path: web/.lighthouseci
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Playwright e2e
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.e2e == true ||
      inputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}

      - name: Build binary
        run: task build

      - name: Install Playwright browser
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run e2e
        working-directory: web
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  ci-success:
    name: CI success
    if: always()
    needs:
      - lint
      - go-test
      - go-fuzz
      - go-coverage
      - go-mutation
      - go-build
      - self-check
      - web-test
      - govulncheck
      - pnpm-audit
      - deadcode
      - gosec
      - dependency-review
      - docker
      - lighthouse
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: ${RESULTS}"
          # skipped is OK (manual inputs / non-PR dependency-review)
          if echo "${RESULTS}" | grep -Eq '(failure|cancelled)'; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi
