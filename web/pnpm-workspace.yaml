# Athenaeum frontend workspace (pnpm 12).
# Settings live here, not in .npmrc (pnpm 12 reads only auth/registry
# keys from .npmrc; everything else comes from this file).
packages:
  - "."

# Force patched / fixed transitive deps (Dependabot + supply-chain).
overrides:
  "@xmldom/xmldom": ">=0.8.13"
  sharp: ">=0.35.0"
  qs: ">=6.16.0"
  uuid: ">=11.1.1"
  tmp: ">=0.2.7"
  adm-zip: ">=0.6.1"
  # No upstream fix for symlink path traversal yet. Vendored 2.0.2 with checks.
  extract-zip: link:vendor/extract-zip

# Fail on packages that declare an incompatible Node engine.
# (Previously in web/.npmrc, which pnpm 12 ignores for non-auth keys.)
engineStrict: true

# Supply-chain defaults aligned with pnpm 12 (explicit for clarity).
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false
blockExoticSubdeps: true
strictDepBuilds: true
strictPeerDependencies: true
trustPolicy: no-downgrade
verifyDepsBeforeRun: install
# Warn on packageManager mismatch so local pnpm 11/12 can build when the
# repo pins a specific pnpm version. "download" would auto-fetch the pin.
pmOnFail: warn

# Let `pnpm update` / `pnpm outdated` also check SHA-pinned GitHub
# Actions in .github/workflows (Added in pnpm 11.16). ignoreDeps holds
# back entries that need dedicated migration work.
update:
  githubActions: true
  ignoreDeps:
    # 30.1.x breaks URL.createObjectURL under the vitest jsdom env.
    - jsdom
    # TS 7 is the tsgo native compiler; svelte-check/eslint compat needs
    # a dedicated migration pass.
    - typescript
    # Sentry 11 is a major bump; review its migration notes first.
    - "@sentry/svelte"

# Packages whose publisher history trips trustPolicy on fresh resolve.
# Review periodically. Prefer removing once maintainers stabilize ownership.
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@5.7.2
  - semver@6.3.1
  - "@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1"
  # Pre-provenance release (Jan 2025, unchanged maintainers) pulled by vitest 5.0.2.
  - why-is-node-running@3.2.2

# Explicit allowlist for packages that may run install scripts.
allowBuilds:
  esbuild: true
  "@sveltejs/vite-plugin-svelte": false
  svelte-preprocess: false
  core-js: false
  es5-ext: false
  # Browser Kokoro uses onnxruntime-web; node/gpu native builds are unused.
  onnxruntime-node: false
  sharp: false
  # Transitive via kokoro-js -> onnxruntime-web. postinstall is advisory only.
  protobufjs: false

minimumReleaseAgeExclude:
  - adm-zip@0.6.1
