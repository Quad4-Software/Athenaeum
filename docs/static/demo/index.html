<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Athenaeum demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;

        display: grid;
        place-items: center;

        color: #f5f5f7;

      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;

      }
      code {
        font-size: 0.95em;
      }

  <body>
    <main>
      <h1>Offline demo</h1>
      <p>
        On GitHub Pages this path is replaced with the built SPA. Locally run
        <code>task build:demo</code> and copy <code>site/</code> into
        <code>docs/build/demo/</code> after <code>task docs:build</code>.
      </p>
      <p><a href="../">Back to docs</a></p>
    </main>
  </body>
</html>
